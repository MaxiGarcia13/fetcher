name: Bump major on main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-e2e:
    uses: ./.github/workflows/lint-and-e2e.yml

  bump:
    needs: lint-and-e2e
    uses: MaxiGarcia13/gh-actions/.github/workflows/bump-major.yml@main
    secrets: inherit

  deploy:
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/deploy-to-vercel.yml@main
    secrets: inherit
