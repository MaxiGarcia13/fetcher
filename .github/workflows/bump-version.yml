name: Lint + E2E tests + Bump version + Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-and-e2e:
    uses: ./.github/workflows/lint-and-e2e.yml

  bump:
    needs: lint-and-e2e
    uses: MaxiGarcia13/gh-actions/.github/workflows/bump-version.yml@main

  deploy:
    needs: bump
    uses: MaxiGarcia13/gh-actions/.github/workflows/deploy-to-vercel.yml@main
    secrets: inherit
    with:
      deployment_environment: Production
      deployment_url: https://fetcherapi.vercel.app
